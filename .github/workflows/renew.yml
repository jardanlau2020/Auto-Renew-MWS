name: Auto Renew MWS
on:
  schedule:
    - cron: '30 22 */6 * *'   # 每 6 日（北京 06:30）
  workflow_dispatch:

jobs:
  Renew-mws:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq wget
          pip install curl_cffi

      # ⚠️ 原版呢步係 bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
      #    = 每次執行第三方腳本，供應鏈風險。已改為：只在有 NODE_LINK 時才用
      #    官方 GitHub Release 的 sing-box（版本釘死），唔再拉第三方腳本。
      - name: ⚙ 可选代理（sing-box，官方 release，版本钉死）
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -z "$NODE_LINK" ]; then echo "ℹ️ 未設定 NODE_LINK，跳過代理（直連）"; exit 0; fi
          set -e
          SBV=1.11.0
          wget -qO sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SBV}/sing-box-${SBV}-linux-amd64.tar.gz"
          tar -xzf sb.tar.gz
          cp "sing-box-${SBV}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          python3 - <<'PY'
          import os, json, base64, urllib.parse
          link = os.environ.get("NODE_LINK","").strip()
          def q(s):
              p = urllib.parse.urlparse(s)
              return dict(host=p.hostname, port=p.port or 443, q=urllib.parse.parse_qs(p.query))
          out = {"log":{"level":"warn"},"inbounds":[{"type":"mixed","tag":"in","listen":"127.0.0.1","listen_port":1081}],"outbounds":[]}
          if link.startswith("vless://"):
              u = q(link); p = urllib.parse.urlparse(link)
              ob = {"type":"vless","tag":"out","server":u["host"],"server_port":u["port"],"uuid":p.username,
                    "tls":{"enabled":u["q"].get("security",["none"])[0]=="tls",
                           "server_name":(u["q"].get("sni") or u["q"].get("host") or [u["host"]])[0],
                           "utls":{"enabled":True,"fingerprint":(u["q"].get("fp") or ["chrome"])[0]}}}
              if (u["q"].get("type") or ["tcp"])[0] == "ws":
                  ob["transport"] = {"type":"ws","path":(u["q"].get("path") or ["/"])[0].replace("%2F","/"),
                                     "headers":{"Host":(u["q"].get("host") or [u["host"]])[0]}}
              out["outbounds"].append(ob)
          else:
              raise SystemExit("只支援 vless:// 链接")
          json.dump(out, open("sing-box-config.json","w"), indent=1)
          print("sing-box config ready for", u["host"])
          PY
          ./sing-box run -c sing-box-config.json > sing-box.log 2>&1 &
          sleep 4
          curl -s -m 10 -x http://127.0.0.1:1081 -o /dev/null -w "proxy check http=%{http_code}\n" https://www.gstatic.com/generate_204 || true

      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          COOKIE: ${{ secrets.COOKIE }}
          SERVER_IDS: ${{ secrets.SERVER_IDS }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 app.py

      - name: 🧽 清理
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log sb.tar.gz

      - name: 🕒 提交运行时间
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date '+%Y-%m-%d %H:%M:%S' > time.txt
          git add time.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update run time"
          git push || true
